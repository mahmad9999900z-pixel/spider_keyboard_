<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#06060a">
<title>🕷️ Spider-Man Ultimate Keyboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ================= RESET & VARIABLES ================= */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --miles-red: #e62429;
  --miles-blue: #00d2ff;
  --bg-dark: #06060a;
  --glass-bg: rgba(10, 10, 15, 0.7);
  --glass-border: rgba(255, 255, 255, 0.15);
  --kb-font: 'Cairo', sans-serif; /* الخط الافتراضي */
}
html, body { height: 100%; overflow: hidden; font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: #fff; user-select: none; -webkit-user-select: none; }

/* ================= الخلفية ================= */
.bg-image {
  position: fixed; inset: 0; z-index: 0;
  /* 🚨 ضع رابط صورتك هنا 🚨 */
  background-image: url('https://images.unsplash.com/photo-1635805737707-575885ab0820?q=80&w=1080&auto=format&fit=crop'); 
  background-size: cover;
  background-position: center;
  animation: panZoom 25s infinite alternate ease-in-out;
}
@keyframes panZoom { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }
.bg-overlay { position: fixed; inset: 0; z-index: 1; background: linear-gradient(to bottom, rgba(6,6,10,0.2) 0%, rgba(6,6,10,0.8) 50%, rgba(6,6,10,0.98) 100%); }
.embers { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.ember { position: absolute; bottom: -20px; width: 4px; height: 4px; background: #ff4500; border-radius: 50%; box-shadow: 0 0 10px #ff4500; animation: floatUp linear infinite; }
@keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.5; } 100% { transform: translateY(-110vh) translateX(40px) scale(0); opacity: 0; } }

/* ================= التطبيق ================= */
.app { position: relative; z-index: 10; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

/* الشريط العلوي */
.top-bar { display: flex; justify-content: space-between; padding: 15px 20px; align-items: center; }
.icon-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s; }
.icon-btn:hover { background: var(--miles-red); }

/* إطار صورة سبايدر مان */
.hero-image-container { display: flex; justify-content: center; margin-top: 5px; }
.hero-image { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--miles-red); box-shadow: 0 0 20px var(--miles-red); object-fit: cover; object-position: top; transition: 0.3s; }

/* شاشة العرض */
.display-container { flex: 1; padding: 15px; display: flex; align-items: center; justify-content: center; }
.display-box { width: 100%; max-width: 800px; height: 100%; max-height: 200px; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; font-size: 22px; line-height: 1.5; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); direction: auto; text-align: right; }
.placeholder { color: rgba(255,255,255,0.3); font-style: italic; }
.cursor { display: inline-block; width: 2px; height: 1.2em; background: var(--miles-red); vertical-align: middle; animation: blink 1s infinite; box-shadow: 0 0 10px var(--miles-red); }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* ================= الكيبورد ================= */
.keyboard-wrapper { 
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  padding: 10px 10px calc(15px + env(safe-area-inset-bottom, 0px)); 
  background: linear-gradient(to bottom, rgba(6,6,10,0.9), rgba(6,6,10,0.98)); 
  border-top: 1px solid rgba(230, 36, 41, 0.4); 
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); 
  box-shadow: 0 -10px 50px rgba(0, 210, 255, 0.1); 
  transition: transform 0.3s ease;
}
/* وضع الكيبورد العائم */
.keyboard-wrapper.floating {
  top: 50%; bottom: auto; left: 50%; right: auto;
  transform: translate(-50%, -50%);
  width: 95vw; border-radius: 15px; border: 1px solid var(--miles-red);
  box-shadow: 0 0 40px rgba(230,36,41,0.3);
}

/* مقبض السحب */
.drag-handle {
  display: none; width: 60px; height: 6px; background: rgba(255,255,255,0.3);
  border-radius: 10px; margin: 0 auto 10px auto; cursor: grab;
}
.keyboard-wrapper.floating .drag-handle { display: block; }
.drag-handle:active { cursor: grabbing; }

/* شريط اللغة */
.lang-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.lang-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #aaa; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
.lang-btn.active { background: rgba(230, 36, 41, 0.2); color: #fff; border-color: var(--miles-red); }

/* الصفوف والأزرار */
.keyboard { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.kb-row { display: flex; gap: 5px; justify-content: center; }
.key {
  flex: 1; min-width: 0; height: 50px; border: none; border-radius: 10px;
  background: linear-gradient(180deg, rgba(40,40,50,0.9) 0%, rgba(20,20,25,0.9) 100%);
  color: #fff; font-family: var(--kb-font); font-size: 22px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 0 rgba(0,0,0,0.8);
  transition: transform 0.05s, box-shadow 0.05s, background 0.2s;
  touch-action: manipulation;
}
.key:active, .key.pressed { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0.8), 0 0 20px var(--miles-blue); background: linear-gradient(180deg, rgba(60,60,70,0.9) 0%, rgba(30,30,40,0.9) 100%); }
.key.special { background: linear-gradient(180deg, rgba(230, 36, 41, 0.8) 0%, rgba(150, 20, 25, 0.9) 100%); border-color: rgba(255,100,100,0.3); }
.key.space { background: linear-gradient(180deg, rgba(20,20,25,0.9) 0%, rgba(10,10,15,0.9) 100%); }
.w-2 { flex: 2; } .w-3 { flex: 3; } .w-5 { flex: 5; }
.spider-icon { width: 26px; height: 26px; }

/* ================= قائمة الإعدادات (المودال) ================= */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 999; display: none; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-content { background: #15151a; border: 1px solid var(--miles-red); border-radius: 20px; width: 90%; max-width: 400px; padding: 20px; box-shadow: 0 0 30px rgba(230,36,41,0.3); }
.modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; color: var(--miles-red); }
.setting-group { margin-bottom: 15px; }
.setting-label { font-size: 14px; color: #aaa; margin-bottom: 8px; display: block; }
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.option-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-family: inherit; font-size: 14px; }
.option-btn.active { background: var(--miles-red); border-color: var(--miles-red); }
.close-modal { width: 100%; padding: 12px; background: #fff; color: #000; font-weight: bold; border: none; border-radius: 10px; margin-top: 10px; cursor: pointer; }

@media (max-height: 700px) { .key { height: 44px; font-size: 19px; } .hero-image { width: 80px; height: 80px; } .display-box { font-size: 18px; max-height: 150px; } }
</style>
</head>
<body>

<!-- الخلفية -->
<div class="bg-image"></div>
<div class="bg-overlay"></div>
<div class="embers" id="embers"></div>

<!-- التطبيق -->
<div class="app">
  <div class="top-bar">
    <button class="icon-btn" onclick="toggleFloatMode()" title="سحب الكيبورد">↕️</button>
    <button class="icon-btn" onclick="openSettings()" title="الإعدادات">⚙️</button>
  </div>

  <!-- صورة سبايدر مان -->
  <div class="hero-image-container">
    <!-- 🚨 ضع رابط صورة مايلز موراليس هنا 🚨 -->
    <img src="https://images.unsplash.com/photo-1635805737707-575885ab0820?q=80&w=400&auto=format&fit=crop" class="hero-image" alt="Spider-Man">
  </div>

  <div class="display-container">
    <div class="display-box" id="display">
      <span class="placeholder" id="placeholder">جرب الأصوات والخطوط الجديدة من الإعدادات ⚙️</span><span id="text"></span><span class="cursor"></span>
    </div>
  </div>
</div>

<!-- الكيبورد -->
<div class="keyboard-wrapper" id="kb-wrapper">
  <div class="drag-handle" id="drag-handle"></div>
  <div class="lang-bar" id="lang-bar"></div>
  <div class="keyboard" id="keyboard"></div>
</div>

<!-- قائمة الإعدادات -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal-content">
    <div class="modal-title">إعدادات التطبيق ⚙️</div>
    
    <div class="setting-group">
      <span class="setting-label">نوع الصوت:</span>
      <div class="options-grid" id="sound-options">
        <button class="option-btn active" onclick="setSound('fire')">🔥 نار</button>
        <button class="option-btn" onclick="setSound('water')">💧 ماء</button>
        <button class="option-btn" onclick="setSound('gun')">🔫 طلقة</button>
        <button class="option-btn" onclick="setSound('none')">🔇 بدون</button>
      </div>
    </div>

    <div class="setting-group">
      <span class="setting-label">نوع الخط:</span>
      <div class="options-grid" id="font-options">
        <button class="option-btn active" onclick="setFont('Cairo', this)">Cairo</button>
        <button class="option-btn" onclick="setFont('Tajawal', this)">Tajawal</button>
        <button class="option-btn" onclick="setFont('Bebas Neue', this)">Bebas</button>
        <button class="option-btn" onclick="setFont('Roboto', this)">Roboto</button>
      </div>
    </div>

    <button class="close-modal" onclick="closeSettings()">حفظ وإغلاق</button>
  </div>
</div>

<script>
// ================= الحالة =================
const state = { 
  currentLang: 'ar', layout: 'ar', shift: false, capsLock: false, text: '',
  soundType: 'fire', isFloating: false
};

// ================= التخطيطات =================
const langNames = { ar: 'العربية', en: 'English', fr: 'Français', es: 'Español', ru: 'Русский' };
const layouts = {
  ar: [['ض','ص','ث','ق','ف','غ','ع','ه','خ','ح','ج'],['ش','س','ي','ب','ل','ا','ت','ن','م','ك','ط'],['SHIFT','ئ','ء','ؤ','ر','لا','ى','ة','و','ز','ظ','DEL'],['NUM','LANG_AR','SPACE','ENTER']],
  en: [['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['SHIFT','z','x','c','v','b','n','m','DEL'],['NUM','LANG_EN','SPACE','ENTER']],
  fr: [['a','z','e','r','t','y','u','i','o','p'],['q','s','d','f','g','h','j','k','l','m'],['SHIFT','w','x','c','v','b','n',',','.','DEL'],['NUM','LANG_FR','SPACE','ENTER']],
  es: [['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l','ñ'],['SHIFT','z','x','c','v','b','n','m','DEL'],['NUM','LANG_ES','SPACE','ENTER']],
  ru: [['й','ц','у','к','е','н','г','ш','щ','з','х','ъ'],['ф','ы','в','а','п','р','о','л','д','ж','э'],['SHIFT','я','ч','с','м','и','т','ь','б','ю','DEL'],['NUM','LANG_RU','SPACE','ENTER']],
  num: [['1','2','3','4','5','6','7','8','9','0'],['-','/',':',';','(',')','$','&','@','"'],['#+=','.',',','?','!',"'",'DEL'],['LANG_AR','SPACE','ENTER']],
  sym: [['[',']','{','}','#','%','^','*','+','='],['_','\\','|','~','<','>','€','£','¥','•'],['NUM','.',',','?','!',"'",'DEL'],['LANG_AR','SPACE','ENTER']]
};
let lastShiftTap = 0;

// ================= الإعدادات (المودال) =================
function openSettings() { document.getElementById('settings-modal').classList.add('active'); }
function closeSettings() { document.getElementById('settings-modal').classList.remove('active'); }

function setSound(type) {
  state.soundType = type;
  document.querySelectorAll('#sound-options .option-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  playCurrentSound(); // تجربة الصوت
}

function setFont(fontName, btn) {
  document.documentElement.style.setProperty('--kb-font', `'${fontName}', sans-serif`);
  document.querySelectorAll('#font-options .option-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ================= وضع الكيبورد العائم =================
function toggleFloatMode() {
  const wrapper = document.getElementById('kb-wrapper');
  state.isFloating = !state.isFloating;
  if (state.isFloating) {
    wrapper.classList.add('floating');
    if (!wrapper.style.top) {
      wrapper.style.top = '50%';
      wrapper.style.left = '50%';
      wrapper.style.transform = 'translate(-50%, -50%)';
    }
  } else {
    wrapper.classList.remove('floating');
    wrapper.style.top = ''; wrapper.style.left = ''; wrapper.style.transform = '';
  }
  vibrate();
}

// سحب الكيبورد (Drag Logic)
const wrapper = document.getElementById('kb-wrapper');
const dragHandle = document.getElementById('drag-handle');
let isDragging = false, startX, startY, initialX, initialY;

dragHandle.addEventListener('pointerdown', (e) => {
  if (!state.isFloating) return;
  isDragging = true;
  startX = e.clientX; startY = e.clientY;
  const rect = wrapper.getBoundingClientRect();
  initialX = rect.left; initialY = rect.top;
  wrapper.style.transform = 'none'; // إزالة translate للسماح بالسحب
  wrapper.style.left = initialX + 'px';
  wrapper.style.top = initialY + 'px';
});

document.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  wrapper.style.left = (initialX + dx) + 'px';
  wrapper.style.top = (initialY + dy) + 'px';
});

document.addEventListener('pointerup', () => { isDragging = false; });

// ================= بناء الكيبورد =================
function renderLangBar() {
  const bar = document.getElementById('lang-bar'); bar.innerHTML = '';
  Object.keys(langNames).forEach(code => {
    const btn = document.createElement('button');
    btn.className = `lang-btn ${state.currentLang === code ? 'active' : ''}`;
    btn.textContent = langNames[code];
    btn.onclick = () => { state.currentLang = code; state.layout = code; renderLangBar(); renderKeyboard(); vibrate(); };
    bar.appendChild(btn);
  });
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard'); kb.innerHTML = '';
  (layouts[state.layout] || layouts['ar']).forEach(rowKeys => {
    const rowEl = document.createElement('div'); rowEl.className = 'kb-row';
    rowKeys.forEach(key => {
      const btn = document.createElement('button'); btn.className = 'key'; btn.dataset.key = key;
      let isSpecial = false;
      if (key === 'SHIFT') { btn.innerHTML = '⇧'; isSpecial = true; if (state.shift || state.capsLock) btn.classList.add('shift-on'); }
      else if (key === 'DEL') { btn.innerHTML = '⌫'; isSpecial = true; btn.classList.add('w-2'); }
      else if (key === 'NUM') { btn.textContent = '?123'; isSpecial = true; btn.classList.add('w-2'); }
      else if (key === '#+=') { btn.textContent = '#+='; isSpecial = true; btn.classList.add('w-2'); }
      else if (key.startsWith('LANG_')) { btn.innerHTML = '🌐'; isSpecial = true; btn.classList.add('w-2'); }
      else if (key === 'SPACE') { btn.classList.add('space', 'w-5'); btn.innerHTML = `<svg class="spider-icon" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="14" rx="4" ry="5"/><circle cx="12" cy="8" r="2.5"/><g stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"><path d="M10 3 L8 1 M14 3 L16 1 M9 5 L6 3 M15 5 L18 3 M8 9 L4 7 M16 9 L20 7 M8 12 L4 12 M16 12 L20 12 M8 15 L4 18 M16 15 L20 18 M9 18 L6 21 M15 18 L18 21"/></g></svg>`; isSpecial = true; }
      else if (key === 'ENTER') { btn.innerHTML = '↵'; isSpecial = true; btn.classList.add('w-3'); }
      else { btn.textContent = (state.shift || state.capsLock) && ['en','fr','es','ru'].includes(state.layout) ? key.toUpperCase() : key; }
      
      if (isSpecial && !btn.classList.contains('space')) btn.classList.add('special');
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); handleKey(key, btn); });
      rowEl.appendChild(btn);
    });
    kb.appendChild(rowEl);
  });
}

function handleKey(key, btn) {
  btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 80);
  playCurrentSound(); vibrate();
  
  if (key === 'SHIFT') { const now = Date.now(); if (now - lastShiftTap < 350) { state.capsLock = !state.capsLock; state.shift = false; } else { state.shift = !state.shift; } lastShiftTap = now; renderKeyboard(); return; }
  if (key === 'DEL') { state.text = state.text.slice(0, -1); updateText(); return; }
  if (key === 'NUM') { state.layout = 'num'; renderKeyboard(); return; }
  if (key === '#+=') { state.layout = 'sym'; renderKeyboard(); return; }
  if (key.startsWith('LANG_')) { state.layout = state.currentLang; renderKeyboard(); return; }
  
  if (key === 'SPACE') state.text += ' ';
  else if (key === 'ENTER') state.text += '\n';
  else {
    let char = key;
    if (['en','fr','es','ru'].includes(state.layout) && (state.shift || state.capsLock)) char = key.toUpperCase();
    state.text += char;
    if (state.shift && !state.capsLock) { state.shift = false; renderKeyboard(); }
  }
  updateText();
}

function updateText() {
  const ph = document.getElementById('placeholder'), txt = document.getElementById('text'), disp = document.getElementById('display');
  if (state.text.length === 0) { ph.style.display = 'inline'; txt.textContent = ''; }
  else { ph.style.display = 'none'; txt.textContent = state.text; disp.style.direction = /[\u0600-\u06FF]/.test(state.text) ? 'rtl' : 'ltr'; disp.style.textAlign = /[\u0600-\u06FF]/.test(state.text) ? 'right' : 'left'; }
  disp.scrollTop = disp.scrollHeight;
}

// ================= الأصوات (Web Audio API) =================
function vibrate() { if (navigator.vibrate) navigator.vibrate(10); }
let audioCtx;
function playCurrentSound() {
  if (state.soundType === 'none') return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    
    if (state.soundType === 'fire') {
      // صوت نار
      const bufferSize = audioCtx.sampleRate * 0.15;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.setValueAtTime(1000, now); filter.frequency.exponentialRampToValueAtTime(300, now + 0.15);
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      noise.connect(filter).connect(gain).connect(audioCtx.destination); noise.start(now);
    } 
    else if (state.soundType === 'water') {
      // صوت ماء (قطرة)
      const osc = audioCtx.createOscillator(); osc.type = 'sine'; 
      osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain).connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.1);
    } 
    else if (state.soundType === 'gun') {
